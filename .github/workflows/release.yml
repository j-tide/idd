name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches repository version
        run: python3 scripts/release.py --check --expect-tag "${GITHUB_REF_NAME}"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate release notes
        run: python3 scripts/release.py --notes "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          set -- --verify-tag --title "$TAG" --notes-file /tmp/release-notes.md
          case "$TAG" in
            *-*)
              set -- "$@" --prerelease
              ;;
          esac
          gh release create "$TAG" "$@"
