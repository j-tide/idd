<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="100%" role="img" aria-label="IDD 多原生 Agent 隔离并行与看板一键接力架构（深色）">
  <defs>
    <marker id="arr-muted-zhd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent-zhd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green-zhd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="369" rx="14" fill="#0b0b0e" stroke="#27272a" stroke-width="1"/>

  <!-- Column 1: Native Coding Agents -->
  <rect x="24" y="20" width="214" height="292" rx="12" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="44" fill="#f4f4f5" font-size="13" font-weight="650" class="sans">原生 AI 编程工具</text>
  <text x="40" y="61" fill="#71717a" font-size="10.5" class="sans">保持原生交互 · 零套壳锁定</text>

  <!-- Agent 1 -->
  <rect x="38" y="78" width="186" height="62" rx="8" fill="#18181d" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <circle cx="52" cy="96" r="4" fill="#38bdf8"/>
  <text x="63" y="100" fill="#f4f4f5" font-size="12" font-weight="600" class="sans">Claude Code</text>
  <text x="50" y="118" fill="#a1a1aa" font-size="10.5" class="sans">沟通需求并开工 #115</text>
  <text x="50" y="132" fill="#7dd3fc" font-size="9.5" class="mono">idd start 115</text>

  <!-- Agent 2 -->
  <rect x="38" y="150" width="186" height="62" rx="8" fill="#18181d" stroke="rgba(192,132,252,0.28)" stroke-width="1"/>
  <circle cx="52" cy="168" r="4" fill="#c084fc"/>
  <text x="63" y="172" fill="#f4f4f5" font-size="12" font-weight="600" class="sans">Codex</text>
  <text x="50" y="190" fill="#a1a1aa" font-size="10.5" class="sans">并行独立开发 #51</text>
  <text x="50" y="204" fill="#d8b4fe" font-size="9.5" class="mono">idd start 51</text>

  <!-- Agent 3 -->
  <rect x="38" y="222" width="186" height="62" rx="8" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.28)" stroke-width="1"/>
  <circle cx="52" cy="240" r="4" fill="#34d399"/>
  <text x="63" y="244" fill="#f4f4f5" font-size="12" font-weight="600" class="sans">Antigravity</text>
  <text x="50" y="262" fill="#a1a1aa" font-size="10.5" class="sans">一键接手 #115 并合入</text>
  <text x="50" y="276" fill="#6ee7b7" font-size="9.5" class="mono">粘贴接力词 · idd land</text>

  <text x="131" y="301" text-anchor="middle" fill="#71717a" font-size="10" class="sans">随时通过看板无损切换工具</text>

  <!-- Connectors: Agents -> Worktrees -->
  <line x1="238" y1="126" x2="264" y2="126" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-muted-zhd)"/>
  <line x1="238" y1="244" x2="264" y2="244" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-muted-zhd)"/>

  <!-- Column 2 Top: Linear main -->
  <rect x="268" y="20" width="424" height="58" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <rect x="282" y="37" width="48" height="22" rx="5" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.32)" stroke-width="1"/>
  <text x="306" y="52" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600" class="mono">main</text>
  <line x1="342" y1="48" x2="674" y2="48" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="520" y1="48" x2="674" y2="48" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <circle cx="366" cy="48" r="4.5" fill="#131317" stroke="#71717a" stroke-width="2"/>
  <circle cx="430" cy="48" r="4.5" fill="#131317" stroke="#71717a" stroke-width="2"/>
  <circle cx="562" cy="48" r="5.5" fill="#34d399"/>
  <text x="562" y="34" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600" class="mono">feat: #115</text>
  <circle cx="644" cy="48" r="5" fill="#131317" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="644" y="34" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600" class="mono">fix: #51</text>
  <text x="284" y="70" fill="#71717a" font-size="9.8" class="sans">main 保持单条直线 · Squash 合入 · 零 TASK/ 残留</text>

  <!-- Landing Arrow from Worktrees to main -->
  <path d="M 608 100 C 608 82, 562 88, 562 57" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arr-green-zhd)"/>

  <!-- Column 2 Center: Isolated Issue Worktrees -->
  <rect x="268" y="100" width="424" height="212" rx="12" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <text x="284" y="123" fill="#f4f4f5" font-size="13" font-weight="650" class="sans">以 Issue 锚定的独立 Worktree</text>
  <text x="676" y="123" text-anchor="end" fill="#71717a" font-size="10.2" class="sans">落盘进度跨工具不丢失</text>

  <!-- Worktree Card 1 -->
  <rect x="284" y="136" width="392" height="74" rx="9" fill="#18181d" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <text x="298" y="156" fill="#38bdf8" font-size="11.5" font-weight="650" class="mono">#115</text>
  <text x="336" y="156" fill="#f4f4f5" font-size="12" font-weight="600" class="sans">支持大数据量 CSV 流式导出接口</text>
  <rect x="606" y="142" width="58" height="19" rx="5" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.32)" stroke-width="1"/>
  <text x="635" y="155" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600" class="mono">2/3</text>
  <text x="298" y="176" fill="#a1a1aa" font-size="10.2" class="mono">目录: ../acme-api-worktrees/115-csv-stream</text>
  <text x="298" y="194" fill="#71717a" font-size="10.2" class="mono">分支: feat/115-csv-stream  ·  TASK/115/</text>

  <!-- Worktree Card 2 -->
  <rect x="284" y="220" width="392" height="74" rx="9" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="298" y="240" fill="#c084fc" font-size="11.5" font-weight="650" class="mono">#51</text>
  <text x="330" y="240" fill="#f4f4f5" font-size="12" font-weight="600" class="sans">Webhook 失败指数退避重试</text>
  <rect x="606" y="226" width="58" height="19" rx="5" fill="#1f1f26" stroke="#3f3f46" stroke-width="1"/>
  <text x="635" y="239" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="600" class="mono">1/2</text>
  <text x="298" y="260" fill="#a1a1aa" font-size="10.2" class="mono">目录: ../billing-web-worktrees/51-webhook-retry</text>
  <text x="298" y="278" fill="#71717a" font-size="10.2" class="mono">分支: fix/51-webhook-retry  ·  TASK/51/</text>

  <!-- Connectors: Worktrees -> idd board -->
  <line x1="692" y1="173" x2="718" y2="173" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-muted-zhd)"/>
  <line x1="692" y1="257" x2="718" y2="257" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-muted-zhd)"/>

  <!-- Column 3: idd board Radar & Handoff -->
  <rect x="722" y="20" width="214" height="292" rx="12" fill="#131317" stroke="rgba(56,189,248,0.28)" stroke-width="1.2"/>
  <rect x="738" y="34" width="66" height="20" rx="5" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.32)" stroke-width="1"/>
  <text x="771" y="48" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="650" class="mono">idd board</text>
  <text x="812" y="48" fill="#71717a" font-size="10" class="sans">零 Token 雷达</text>

  <text x="738" y="76" fill="#f4f4f5" font-size="13" font-weight="650" class="sans">进度雷达与接力台</text>
  <text x="738" y="94" fill="#a1a1aa" font-size="10.5" class="sans">一眼看清所有仓库、目录、</text>
  <text x="738" y="109" fill="#a1a1aa" font-size="10.5" class="sans">分支、TASK 步骤与 CI 状态。</text>

  <rect x="738" y="126" width="182" height="54" rx="8" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="829" y="146" text-anchor="middle" fill="#f4f4f5" font-size="10.5" font-weight="600" class="sans">2 秒本地实时脉搏</text>
  <text x="829" y="164" text-anchor="middle" fill="#71717a" font-size="9.2" class="mono">改动行数 · 活跃 · 卡住 · CI</text>

  <rect x="738" y="192" width="182" height="44" rx="8" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.34)" stroke-width="1.2"/>
  <text x="829" y="211" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="650" class="sans">一键复制接力提示词</text>
  <text x="829" y="226" text-anchor="middle" fill="#38bdf8" font-size="9.5" class="sans">即粘即用的跨 Agent 上下文</text>

  <rect x="738" y="246" width="182" height="44" rx="8" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="829" y="265" text-anchor="middle" fill="#e4e4e7" font-size="11" font-weight="600" class="sans">一键复制目录 / 分支</text>
  <text x="829" y="280" text-anchor="middle" fill="#71717a" font-size="9.5" class="sans">直达路径与终端命令兜底</text>

  <!-- Return Handoff Loop along Bottom -->
  <path d="M 829 312 L 829 336 Q 829 344 821 344 L 139 344 Q 131 344 131 336 L 131 317" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr-accent-zhd)"/>
  <rect x="306" y="332" width="348" height="22" rx="11" fill="#131317" stroke="rgba(56,189,248,0.32)" stroke-width="1"/>
  <text x="480" y="346.5" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600" class="sans">粘贴接力提示词到任意 Agent 对话框，无缝接着做</text>
</svg>
