<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" role="img" aria-label="IDD Issue-Driven Cross-Tool Workflow">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="main-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .flow-dash { stroke-dasharray: 6 6; animation: dash-flow 1.4s linear infinite; }
    .flow-dash-slow { stroke-dasharray: 5 5; animation: dash-flow 2s linear infinite; }
    .pulse-node { animation: node-pulse 3.2s ease-in-out infinite; }
    .baton-1 { animation: baton-cycle 6s ease-in-out infinite; }
    .baton-2 { animation: baton-cycle 6s ease-in-out 2s infinite; }
    .baton-3 { animation: baton-cycle 6s ease-in-out 4s infinite; }
    .squash-highlight { animation: squash-pop 4s ease-in-out infinite; }
    @keyframes dash-flow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes node-pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes baton-cycle {
      0%, 28% { fill: #1e3a5f; stroke: #38bdf8; }
      35%, 100% { fill: #0f172a; stroke: #334155; }
    }
    @keyframes squash-pop {
      0%, 40%, 100% { opacity: 0.7; }
      55%, 75% { opacity: 1; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="918" height="418" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Dot Grid -->
  <g fill="#1e293b" opacity="0.5">
    <circle cx="40" cy="110" r="1"/><circle cx="120" cy="110" r="1"/><circle cx="200" cy="110" r="1"/>
    <circle cx="280" cy="110" r="1"/><circle cx="360" cy="110" r="1"/><circle cx="440" cy="110" r="1"/>
    <circle cx="520" cy="110" r="1"/><circle cx="600" cy="110" r="1"/><circle cx="680" cy="110" r="1"/>
    <circle cx="760" cy="110" r="1"/><circle cx="840" cy="110" r="1"/>
  </g>

  <!-- TOP LANE: Linear main branch -->
  <rect x="24" y="20" width="872" height="72" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="38" y="42" width="70" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="73" y="59" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" class="mono">main</text>

  <!-- Straight linear main line -->
  <line x1="126" y1="55" x2="870" y2="55" stroke="url(#main-line-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Commits on main -->
  <circle cx="155" cy="55" r="6" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
  <text x="155" y="80" text-anchor="middle" fill="#64748b" font-size="10" class="mono">init</text>

  <circle cx="255" cy="55" r="6" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
  <text x="255" y="80" text-anchor="middle" fill="#64748b" font-size="10" class="mono">base</text>

  <g class="squash-highlight">
    <circle cx="660" cy="55" r="8" fill="#10b981" filter="url(#glow-green)"/>
    <text x="660" y="38" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600" class="mono">feat: #42 (Squash)</text>
  </g>

  <circle cx="815" cy="55" r="7" fill="#38bdf8" filter="url(#glow-green)"/>
  <text x="815" y="38" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="600" class="mono">fix: #43 (Squash)</text>

  <!-- Linear badge -->
  <rect x="330" y="29" width="246" height="20" rx="10" fill="#111c2e" stroke="#1e3a5f" stroke-width="1"/>
  <text x="453" y="43" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600" class="sans">一条直线 · 0 Merge 节点 · 无 TASK/ 残留</text>

  <!-- LEFT COLUMN: Chat -> Issue -->
  <!-- Chat Box -->
  <rect x="24" y="135" width="186" height="82" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="40" y="160" fill="#f8fafc" font-size="13" font-weight="700" class="sans">1. 聊天聊需求</text>
  <text x="40" y="180" fill="#94a3b8" font-size="11" class="sans">对齐边界与验收清单</text>
  <rect x="40" y="191" width="144" height="18" rx="4" fill="#1e293b"/>
  <text x="112" y="203" text-anchor="middle" fill="#7dd3fc" font-size="10" class="mono">idd issue create</text>

  <!-- Connector Chat -> Issue -->
  <line x1="117" y1="218" x2="117" y2="262" stroke="#38bdf8" stroke-width="2" class="flow-dash" marker-end="url(#arrow-cyan)"/>

  <!-- Issue Box -->
  <rect x="24" y="268" width="186" height="104" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="42" cy="290" r="5" fill="#34d399"/>
  <text x="54" y="294" fill="#f8fafc" font-size="13" font-weight="700" class="sans">2. GitHub Issue</text>
  <text x="40" y="316" fill="#bae6fd" font-size="11" class="mono">#42 feat/42-export-csv</text>
  <text x="40" y="335" fill="#c4b5fd" font-size="11" class="mono">#43 fix/43-dark-flicker</text>
  <text x="40" y="357" fill="#64748b" font-size="10" class="sans">唯一需求真源 · 原生进度条</text>

  <!-- Connectors Issue -> Worktree 1 & Worktree 2 -->
  <path d="M 210 302 C 232 302, 232 195, 250 195" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-dash" marker-end="url(#arrow-cyan)"/>
  <path d="M 210 330 C 232 330, 232 332, 250 332" fill="none" stroke="#a78bfa" stroke-width="2" class="flow-dash-slow" marker-end="url(#arrow-purple)"/>

  <!-- CENTER COLUMN: Parallel Worktrees -->
  <!-- Worktree 1 -->
  <rect x="256" y="128" width="336" height="136" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="274" y="152" fill="#f8fafc" font-size="13" font-weight="700" class="sans">3. 独立 Worktree + 跨工具接力</text>
  <rect x="478" y="137" width="100" height="20" rx="5" fill="#0c2d48" stroke="#0284c7" stroke-width="1"/>
  <text x="528" y="151" text-anchor="middle" fill="#7dd3fc" font-size="10" class="mono">idd start 42</text>

  <text x="274" y="173" fill="#94a3b8" font-size="10.5" class="mono">../worktrees/42-export-csv  (feat/42-export-csv)</text>

  <!-- TASK checklist pills -->
  <rect x="274" y="185" width="90" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="319" y="200" text-anchor="middle" fill="#6ee7b7" font-size="10.5" class="mono">TASK-01 ✓</text>

  <line x1="366" y1="196" x2="386" y2="196" stroke="#34d399" stroke-width="1.5"/>

  <rect x="388" y="185" width="90" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="433" y="200" text-anchor="middle" fill="#6ee7b7" font-size="10.5" class="mono">TASK-02 ✓</text>

  <rect x="488" y="185" width="90" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="533" y="200" text-anchor="middle" fill="#cbd5e1" font-size="10.5" class="mono">idd sync</text>

  <!-- Cross-tool animated baton -->
  <text x="274" y="226" fill="#64748b" font-size="10" class="sans">无缝切换引擎：</text>
  <rect x="274" y="232" width="94" height="22" rx="11" class="baton-1" stroke-width="1.2"/>
  <text x="321" y="247" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="600" class="sans">Claude Code</text>

  <text x="377" y="247" text-anchor="middle" fill="#64748b" font-size="11" class="mono">⇄</text>

  <rect x="386" y="232" width="76" height="22" rx="11" class="baton-2" stroke-width="1.2"/>
  <text x="424" y="247" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="600" class="sans">Codex</text>

  <text x="471" y="247" text-anchor="middle" fill="#64748b" font-size="11" class="mono">⇄</text>

  <rect x="480" y="232" width="98" height="22" rx="11" class="baton-3" stroke-width="1.2"/>
  <text x="529" y="247" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="600" class="sans">Antigravity</text>

  <!-- Worktree 2 (Parallel) -->
  <rect x="256" y="282" width="336" height="90" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="274" y="305" fill="#f8fafc" font-size="12.5" font-weight="700" class="sans">并行开发 Worktree（物理隔离不打架）</text>
  <rect x="494" y="290" width="84" height="20" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="536" y="304" text-anchor="middle" fill="#ddd6fe" font-size="10" class="mono">idd start 43</text>
  <text x="274" y="328" fill="#c4b5fd" font-size="10.5" class="mono">../worktrees/43-dark-flicker  (fix/43-dark-flicker)</text>
  <text x="274" y="352" fill="#94a3b8" font-size="10.5" class="sans">8 类合法前缀校验 · 禁止 codex/*、claude/* 分支</text>

  <!-- Connectors Worktrees -> PR/CI -->
  <path d="M 592 195 L 626 195" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-dash" marker-end="url(#arrow-cyan)"/>
  <path d="M 592 325 C 614 325, 610 220, 626 220" fill="none" stroke="#a78bfa" stroke-width="2" class="flow-dash-slow" marker-end="url(#arrow-purple)"/>

  <!-- RIGHT COLUMN: PR & CI Auto-Heal + Squash Land + Retention -->
  <rect x="632" y="135" width="264" height="122" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="159" fill="#f8fafc" font-size="13" font-weight="700" class="sans">4. PR &amp; CI 自愈 → Squash 合入</text>
  <text x="650" y="180" fill="#94a3b8" font-size="10.5" class="mono">idd pr 42  /  idd ci 42 --logs</text>
  <rect x="650" y="192" width="110" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="705" y="207" text-anchor="middle" fill="#6ee7b7" font-size="10.5" class="sans">CI Passed ✅</text>
  <rect x="768" y="192" width="112" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="824" y="207" text-anchor="middle" fill="#7dd3fc" font-size="10.5" class="mono">idd land 42</text>
  <text x="650" y="238" fill="#cbd5e1" font-size="10.5" class="sans">Rebase → 删 TASK/ → Squash 合入 main</text>

  <!-- Arrow PR/Land -> Linear main -->
  <path d="M 764 135 C 764 98, 660 105, 660 66" fill="none" stroke="#34d399" stroke-width="2.5" class="flow-dash" marker-end="url(#arrow-emerald)"/>

  <!-- Retention Box -->
  <rect x="632" y="282" width="264" height="90" rx="12" fill="#0b1324" stroke="#334155" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text x="650" y="305" fill="#e2e8f0" font-size="12" font-weight="700" class="sans">安全保留现场（不误删）</text>
  <text x="650" y="327" fill="#6ee7b7" font-size="11" class="sans">✓ 默认保留本地与远端需求分支</text>
  <text x="650" y="346" fill="#6ee7b7" font-size="11" class="sans">✓ 默认保留 Worktree（idd cleanup 按需清理）</text>
  <text x="650" y="363" fill="#94a3b8" font-size="10" class="sans">校验 HEAD == headRefOid 后才移除目录</text>
</svg>
