  <rect x="258" y="118" width="210" height="144" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <rect x="274" y="134" width="26" height="19" rx="5" fill="#1c1c22" stroke="#27272a" stroke-width="1"/>
