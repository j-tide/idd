  <text x="508" y="172" fill="#a1a1aa" font-size="11.5" class="sans">Shared TASK/108/ ledger</text>
  <text x="508" y="188" fill="#71717a" font-size="11" class="sans">Test-gated PR/MR &amp; CI logs</text>
  <rect x="508" y="201" width="178" height="20" rx="5" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="597" y="214.5" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="500" class="sans">Claude Code · Codex · Agy</text>
  <rect x="508" y="227" width="178" height="22" rx="6" fill="rgba(56,189,248,0.10)" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <text x="597" y="241.5" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600" class="mono">idd sync · idd pr</text>

  <line x1="702" y1="190" x2="722" y2="190" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow-muted-d)"/>

  <!-- Stage 04: Linear Land -->
  <rect x="726" y="118" width="210" height="144" rx="10" fill="#131317" stroke="rgba(52,211,153,0.34)" stroke-width="1.2"/>
  <rect x="742" y="134" width="26" height="19" rx="5" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.32)" stroke-width="1"/>
  <text x="755" y="147.5" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="600" class="mono">04</text>
  <text x="776" y="148" fill="#f4f4f5" font-size="13.5" font-weight="600" class="sans">Linear Land</text>
  <text x="742" y="172" fill="#a1a1aa" font-size="11.5" class="sans">Rebase, strip TASK/, squash</text>
  <text x="742" y="188" fill="#71717a" font-size="11" class="sans">Closes #108 on main</text>
  <rect x="742" y="201" width="178" height="20" rx="5" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="831" y="214.5" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="500" class="sans">CI green · branches kept</text>
  <rect x="742" y="227" width="178" height="22" rx="6" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.32)" stroke-width="1"/>
  <text x="831" y="241.5" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="600" class="mono">idd land 108</text>

  <!-- Bottom Utility Strip -->
  <rect x="24" y="282" width="444" height="58" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="303" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.06em" class="sans">LIVE OBSERVABILITY (0 TOKEN)</text>
  <text x="40" y="324" fill="#e4e4e7" font-size="11.5" font-weight="500" class="mono">idd board (Web) · idd watch (TUI) · idd status (CLI)</text>

  <rect x="492" y="282" width="444" height="58" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <text x="508" y="303" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.06em" class="sans">SAFE RETENTION</text>
  <text x="508" y="324" fill="#e4e4e7" font-size="11.5" font-weight="500" class="mono">Branches &amp; worktrees kept · idd cleanup (HEAD verified)</text>
</svg>
