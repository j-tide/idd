  <rect x="274" y="201" width="178" height="20" rx="5" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="363" y="214.5" text-anchor="middle" fill="#a1a1aa" font-size="10" class="mono">feat/108-squash-guard</text>
  <rect x="274" y="227" width="178" height="22" rx="6" fill="rgba(56,189,248,0.10)" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <text x="363" y="241.5" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600" class="mono">idd start 108</text>

  <line x1="468" y1="190" x2="488" y2="190" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow-muted-d)"/>

