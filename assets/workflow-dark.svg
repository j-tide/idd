<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" role="img" aria-label="IDD Linear Issue-Driven Workflow (Dark)">
  <defs>
    <marker id="arrow-muted-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="959" height="359" rx="14" fill="#0b0b0e" stroke="#27272a" stroke-width="1"/>

  <!-- Top Lane: Linear main branch -->
  <rect x="24" y="18" width="912" height="64" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
  <rect x="40" y="38" width="56" height="24" rx="6" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.32)" stroke-width="1"/>
  <text x="68" y="54" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="600" class="mono">main</text>

  <line x1="114" y1="50" x2="914" y2="50" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="650" y1="50" x2="914" y2="50" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <circle cx="148" cy="50" r="5" fill="#131317" stroke="#71717a" stroke-width="2"/>
  <text x="148" y="72" text-anchor="middle" fill="#71717a" font-size="10" class="mono">init</text>

  <circle cx="248" cy="50" r="5" fill="#131317" stroke="#71717a" stroke-width="2"/>
  <text x="248" y="72" text-anchor="middle" fill="#71717a" font-size="10" class="mono">base</text>

  <rect x="304" y="38" width="298" height="24" rx="12" fill="#18181d" stroke="#27272a" stroke-width="1"/>
  <text x="453" y="54" text-anchor="middle" fill="#a1a1aa" font-size="11" font-weight="500" class="sans">Linear main · 0 merge commits · No TASK/ residue</text>

  <circle cx="726" cy="50" r="6" fill="#34d399"/>
  <text x="726" y="34" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="600" class="mono">feat: #108 (Squash)</text>

  <circle cx="872" cy="50" r="5.5" fill="#131317" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="872" y="34" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600" class="mono">fix: #47 (Squash)</text>

