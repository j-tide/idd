  <text x="74" y="148" fill="#f4f4f5" font-size="13.5" font-weight="600" class="sans">Issue</text>
  <text x="40" y="172" fill="#a1a1aa" font-size="11.5" class="sans">Align scope &amp; acceptance</text>
  <text x="40" y="188" fill="#71717a" font-size="11" class="sans">Single source of truth</text>
