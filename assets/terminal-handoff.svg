<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" role="img" aria-label="IDD Cross-Tool Terminal Handoff Demo">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .step1 { animation: show-step1 12s linear infinite; }
    .step2 { animation: show-step2 12s linear infinite; }
    .step3 { animation: show-step3 12s linear infinite; }
    .step4 { animation: show-step4 12s linear infinite; }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes show-step1 {
      0%, 2% { opacity: 0; transform: translateY(4px); }
      6%, 90% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; }
    }
    @keyframes show-step2 {
      0%, 20% { opacity: 0; transform: translateY(4px); }
      25%, 90% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; }
    }
    @keyframes show-step3 {
      0%, 42% { opacity: 0; transform: translateY(4px); }
      47%, 90% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; }
    }
    @keyframes show-step4 {
      0%, 64% { opacity: 0; transform: translateY(4px); }
      69%, 90% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect x="1" y="1" width="878" height="408" rx="14" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 1 15 Q 1 1 15 1 L 865 1 Q 879 1 879 15 L 879 38 L 1 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="879" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="440" y="24" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="600" class="mono">idd — Claude Code ⇄ Codex ⇄ Antigravity</text>

  <!-- Step 1: Chat -> Issue -->
  <g class="step1">
    <rect x="24" y="58" width="70" height="22" rx="5" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
    <text x="59" y="73" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" class="sans">Claude</text>
    <text x="106" y="74" fill="#e6edf3" class="mono">$ idd issue create --title "导出 CSV 报表"</text>
    <text x="106" y="96" fill="#3fb950" class="mono">✓ 已创建 Issue #42 (GitHub / 自建 GitLab 自动适配)</text>
  </g>

  <!-- Step 2: Start Worktree -->
  <g class="step2">
    <rect x="24" y="120" width="70" height="22" rx="5" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
    <text x="59" y="135" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" class="sans">Claude</text>
    <text x="106" y="136" fill="#e6edf3" class="mono">$ idd start 42 --slug export-csv</text>
    <text x="106" y="158" fill="#79c0ff" class="mono">✓ 创建独立工作树: ../app-worktrees/42-export-csv (feat/42-export-csv)</text>
    <text x="106" y="178" fill="#8b949e" class="mono">  已同步 .env · 拆解 TASK-01, TASK-02 · 完成 TASK-01 并提交</text>
  </g>

  <!-- Step 3: Cross-tool Handoff to Codex + PR/CI -->
  <g class="step3">
    <rect x="24" y="204" width="70" height="22" rx="5" fill="#1f2937" stroke="#a78bfa" stroke-width="1"/>
    <text x="59" y="219" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700" class="sans">Codex</text>
    <text x="106" y="220" fill="#e6edf3" class="mono">$ idd start 42 &amp;&amp; idd mr 42 &amp;&amp; idd ci 42</text>
    <text x="106" y="242" fill="#d2a8ff" class="mono">↻ 幂等复用工作树 · TASK-01 已完成 · 续写 TASK-02 并提交</text>
    <text x="106" y="262" fill="#3fb950" class="mono">✓ 已创建 PR/MR (Closes #42) · 总体 CI: PASS ✅</text>
  </g>

  <!-- Step 4: Linear Squash Land with Antigravity -->
  <g class="step4">
    <rect x="24" y="288" width="70" height="22" rx="5" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
    <text x="59" y="303" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" class="sans">Agy</text>
    <text x="106" y="304" fill="#e6edf3" class="mono">$ idd land 42</text>
    <text x="106" y="326" fill="#3fb950" class="mono">✓ Rebase origin/main · 清理 TASK/42-export-csv/ · Squash 直线合入</text>
    <text x="106" y="346" fill="#79c0ff" class="mono">✓ 已保留分支 feat/42-export-csv 与工作树 · main 零 Merge 节点</text>
  </g>

  <!-- Prompt & Blinking Cursor -->
  <text x="24" y="384" fill="#3fb950" class="mono">$</text>
  <rect x="38" y="372" width="8" height="15" fill="#e6edf3" class="cursor"/>
</svg>
