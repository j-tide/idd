      function syncChildrenOrder(parent, desiredChildren) {
        const keep = new Set(desiredChildren);
        for (const child of Array.from(parent.children)) {
          if (!keep.has(child)) child.remove();
        }
        for (let i = 0; i < desiredChildren.length; i++) {
          const want = desiredChildren[i];
          const cur = parent.children[i];
          if (cur !== want) {
            parent.insertBefore(want, cur || null);
          }
        }
      }

      function patchHtmlPreservingCopied(curEl, nextEl) {
        if (!curEl || !nextEl) return;
        const nextSig = nextEl.innerHTML;
        if (curEl._lastInnerSig === nextSig) return;
        if (curEl._lastInnerSig === undefined && !curEl.querySelector("[data-copy-val].copied") && curEl.innerHTML === nextSig) {
          curEl._lastInnerSig = nextSig;
          return;
        }
        curEl._lastInnerSig = nextSig;

        const activeCopy = new Map();
        curEl.querySelectorAll("[data-copy-val]").forEach((btn) => {
          if (btn.dataset.timerId) {
            activeCopy.set(btn.getAttribute("data-copy-val") || "", {
              html: btn.innerHTML,
              cls: btn.className,
              timerId: btn.dataset.timerId,
              prevHtml: btn.dataset.prevHtml || "",
              minWidth: btn.style.minWidth || ""
            });
          }
        });
        const curFill = curEl.querySelector(".progress-fill");
        const nextFill = nextEl.querySelector(".progress-fill");
        const savedFill = (curFill && nextFill) ? {
          cls: nextFill.className,
          width: nextFill.style.width
        } : null;
        if (savedFill && curFill) {
          curFill.className = savedFill.cls;
          curFill.style.width = savedFill.width;
          const curTrack = curFill.parentElement;
          const nextTrack = nextFill.parentElement;
          if (curTrack && nextTrack) {
            const placeholder = document.createElement("span");
            placeholder.dataset.fillSlot = "1";
            nextTrack.replaceChild(placeholder, nextFill);
          }
        }

        const curKids = Array.from(curEl.children);
        const nextKids = Array.from(nextEl.children);
        const canPatchKids =
          curKids.length > 0 &&
          curKids.length === nextKids.length &&
          curKids.every((c, idx) => c.tagName === nextKids[idx].tagName && c.className === nextKids[idx].className);

        if (canPatchKids) {
          for (let i = 0; i < curKids.length; i++) {
            const ck = curKids[i];
            const nk = nextKids[i];
            const nkHtml = nk.innerHTML;
            if (ck._lastChildHtml === nkHtml) continue;
            if (ck._lastChildHtml === undefined && !ck.querySelector("[data-copy-val].copied,[data-fill-slot]") && ck.innerHTML === nkHtml) {
              ck._lastChildHtml = nkHtml;
              continue;
            }
            ck._lastChildHtml = nkHtml;
            ck.innerHTML = nkHtml;
          }
        } else {
          curEl.innerHTML = nextEl.innerHTML;
        }

        if (savedFill && curFill) {
          const slot = curEl.querySelector("[data-fill-slot]");
          if (slot && slot.parentElement) {
            slot.parentElement.replaceChild(curFill, slot);
          }
        }
        if (activeCopy.size) {
          curEl.querySelectorAll("[data-copy-val]").forEach((btn) => {
            const saved = activeCopy.get(btn.getAttribute("data-copy-val") || "");
            if (saved) {
              btn.className = saved.cls;
              btn.innerHTML = saved.html;
              btn.dataset.timerId = saved.timerId;
              btn.dataset.prevHtml = saved.prevHtml;
              btn.style.minWidth = saved.minWidth;
            }
          });
        }
      }

      function reconcileCardGrid(targetContainer, nextContainer, poolByKey, oldRects, oldStages) {
        const desired = [];
        const children = Array.from(nextContainer.children);
        for (const nextChild of children) {
          const key = nextChild.getAttribute("data-open-key");
          if (!key) {
            desired.push(nextChild.cloneNode(true));
            continue;
          }
          const reused = poolByKey.get(key);
          if (reused) {
            poolByKey.delete(key);
            if (reused.className !== nextChild.className) reused.className = nextChild.className;
            const nextTab = nextChild.getAttribute("tabindex") || "0";
            if (reused.getAttribute("tabindex") !== nextTab) reused.setAttribute("tabindex", nextTab);
            const fgAttr = nextChild.getAttribute("data-forge");
            if (fgAttr != null && reused.getAttribute("data-forge") !== fgAttr) reused.setAttribute("data-forge", fgAttr);
            patchHtmlPreservingCopied(reused, nextChild);
            const nextBadge = reused.querySelector(".card-top .badge") || reused.querySelector("td .badge");
            if (nextBadge && oldStages.has(key) && oldStages.get(key) !== nextBadge.textContent && !prefersReducedMotion()) {
              nextBadge.classList.remove("is-stage-bumped");
              void nextBadge.offsetWidth;
              nextBadge.classList.add("is-stage-bumped");
              setTimeout(() => nextBadge.classList.remove("is-stage-bumped"), 220);
            }
            desired.push(reused);
          } else {
            const fresh = nextChild.cloneNode(true);
            fresh._lastInnerSig = nextChild.innerHTML;
            if (!prefersReducedMotion() && oldRects.size > 0) {
              fresh.classList.add("card-enter");
              setTimeout(() => fresh.classList.remove("card-enter"), 240);
            }
            desired.push(fresh);
          }
        }
        syncChildrenOrder(targetContainer, desired);
      }

      function reconcileMainContent(container, htmlStr, viewKey) {
        if (typeof window === "undefined" || typeof container.querySelectorAll !== "function") {
          container.innerHTML = htmlStr;
          if (container.dataset) container.dataset.viewKey = viewKey;
          return;
        }
        const prevViewKey = container.dataset.viewKey || "";
        if (prevViewKey !== viewKey) {
          container.innerHTML = htmlStr;
          container.dataset.viewKey = viewKey;
          container.querySelectorAll("[data-open-key]").forEach((el) => {
            el._lastInnerSig = el.innerHTML;
          });
          if (!prefersReducedMotion()) {
            container.classList.remove("view-enter");
            void container.offsetWidth;
            container.classList.add("view-enter");
          }
          return;
        }

        const oldRects = new Map();
        const oldStages = new Map();
        const poolByKey = new Map();
        const existingItems = Array.from(container.querySelectorAll("[data-open-key]"));
        const trackFlip = !prefersReducedMotion() && existingItems.length <= 160;
        for (const el of existingItems) {
          const k = el.getAttribute("data-open-key");
          if (!k) continue;
          poolByKey.set(k, el);
          if (trackFlip) {
            const r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0) oldRects.set(k, r);
          }
          const badge = el.querySelector(".card-top .badge") || el.querySelector("td .badge");
          if (badge) oldStages.set(k, badge.textContent || "");
        }

        const tpl = document.createElement("template");
        tpl.innerHTML = htmlStr;

        if (viewKey === "kanban") {
          const curKanban = container.querySelector(".kanban");
          const nextKanban = tpl.content.querySelector(".kanban");
          if (!curKanban || !nextKanban || curKanban.children.length !== nextKanban.children.length) {
            container.innerHTML = htmlStr;
            container.querySelectorAll("[data-open-key]").forEach((el) => { el._lastInnerSig = el.innerHTML; });
            return;
          }
          for (let i = 0; i < curKanban.children.length; i++) {
            const curCol = curKanban.children[i];
            const nextCol = nextKanban.children[i];
            const curCnt = curCol.querySelector(".col-count");
            const nextCnt = nextCol.querySelector(".col-count");
            if (curCnt && nextCnt && curCnt.textContent !== nextCnt.textContent) {
              curCnt.textContent = nextCnt.textContent;
            }
            const curStack = curCol.querySelector(".card-stack");
            const nextStack = nextCol.querySelector(".card-stack");
            if (curStack && nextStack) {
              reconcileCardGrid(curStack, nextStack, poolByKey, oldRects, oldStages);
            }
          }
        } else if (viewKey === "list") {
          const curBody = container.querySelector(".list-table tbody");
          const nextBody = tpl.content.querySelector(".list-table tbody");
          if (!curBody || !nextBody) {
            container.innerHTML = htmlStr;
            return;
          }
          reconcileCardGrid(curBody, nextBody, poolByKey, oldRects, oldStages);
        } else if (viewKey === "repos") {
          container._lastSimpleHtml = "";
          const curSections = new Map();
          container.querySelectorAll(".repo-section[data-repo-group]").forEach((s) => {
            curSections.set(s.getAttribute("data-repo-group") || "", s);
          });
          const curDrawer = container.querySelector(".cleanup-drawer");
          const curEmpty = container.querySelector(":scope > .empty-state");
          const desired = [];
          for (const nextChild of Array.from(tpl.content.children)) {
            if (nextChild.classList.contains("repo-section")) {
              const gKey = nextChild.getAttribute("data-repo-group") || "";
              const reusedSec = curSections.get(gKey);
              if (reusedSec) {
                curSections.delete(gKey);
                const curHdr = reusedSec.querySelector(".repo-hdr");
                const nextHdr = nextChild.querySelector(".repo-hdr");
                if (curHdr && nextHdr) {
                  patchHtmlPreservingCopied(curHdr, nextHdr);
                }
                const curGrid = reusedSec.querySelector(".repo-grid");
                const nextGrid = nextChild.querySelector(".repo-grid");
                if (curGrid && nextGrid) {
                  reconcileCardGrid(curGrid, nextGrid, poolByKey, oldRects, oldStages);
                }
                desired.push(reusedSec);
              } else {
                const clonedSec = nextChild.cloneNode(true);
                if (!prefersReducedMotion() && oldRects.size > 0) clonedSec.classList.add("view-enter");
                desired.push(clonedSec);
              }
            } else if (nextChild.classList.contains("cleanup-drawer")) {
              if (curDrawer) {
                if (curDrawer.className !== nextChild.className) curDrawer.className = nextChild.className;
                const curHdr = curDrawer.querySelector(".cleanup-hdr");
                const nextHdr = nextChild.querySelector(".cleanup-hdr");
                if (curHdr && nextHdr) {
                  curHdr.setAttribute("aria-expanded", nextHdr.getAttribute("aria-expanded") || "false");
                  const curBadge = curHdr.querySelector(".badge");
                  const nextBadge = nextHdr.querySelector(".badge");
                  if (curBadge && nextBadge && curBadge.textContent !== nextBadge.textContent) curBadge.textContent = nextBadge.textContent;
                }
                const curBody = curDrawer.querySelector(".cleanup-body");
                const nextBody = nextChild.querySelector(".cleanup-body");
                if (curBody && nextBody) {
                  const curTb = curBody.querySelector(".cleanup-toolbar");
                  const nextTb = nextBody.querySelector(".cleanup-toolbar");
                  if (curTb && nextTb) patchHtmlPreservingCopied(curTb, nextTb);
                  else if (!curTb && nextTb) curBody.insertBefore(nextTb.cloneNode(true), curBody.firstChild);
                  const cg = curBody.querySelector(".repo-grid");
                  const ng = nextBody.querySelector(".repo-grid");
                  if (cg && ng) reconcileCardGrid(cg, ng, poolByKey, oldRects, oldStages);
                } else if (nextBody && !curBody) {
                  curDrawer.appendChild(nextBody.cloneNode(true));
                } else if (!nextBody && curBody) {
                  curBody.remove();
                }
                desired.push(curDrawer);
              } else {
                desired.push(nextChild.cloneNode(true));
              }
            } else if (nextChild.classList.contains("empty-state") && curEmpty) {
              patchHtmlPreservingCopied(curEmpty, nextChild);
              desired.push(curEmpty);
            } else {
              desired.push(nextChild.cloneNode(true));
            }
          }
          syncChildrenOrder(container, desired);
        } else {
          if (container._lastSimpleHtml !== htmlStr) {
            container._lastSimpleHtml = htmlStr;
            container.innerHTML = htmlStr;
          }
          return;
        }

        if (trackFlip && oldRects.size > 0) {
          container.querySelectorAll("[data-open-key]").forEach((el) => {
            const k = el.getAttribute("data-open-key");
            const oldR = k ? oldRects.get(k) : null;
            if (!oldR || typeof el.animate !== "function") return;
            const newR = el.getBoundingClientRect();
            const dx = oldR.left - newR.left;
            const dy = oldR.top - newR.top;
            if (newR.width > 0 && (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5)) {
              if (el._flipAnim) {
                try { el._flipAnim.cancel(); } catch (_e) {}
              }
              el._flipAnim = el.animate(
                [{ transform: "translate3d(" + dx + "px," + dy + "px,0)" }, { transform: "translate3d(0,0,0)" }],
                { duration: 240, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
              );
              el._flipAnim.onfinish = () => { el._flipAnim = null; };
            }
          });
        }
      }

      function renderMain() {
        const snap = state.snapshot;
        const container = document.getElementById("main-content");
        if (!snap || !container) return;

        const repos = snap.repos || [];
        if (repos.length === 0) {
          reconcileMainContent(
            container,
            '<div class="empty-state">' +
              '<h3 style="margin:0 0 6px;font-size:14.5px;color:var(--text);">' + tr("暂无已纳管的 Git 仓库", "No monitored Git repositories yet") + "</h3>" +
              '<p style="margin:0;font-size:12.5px;">' + tr("在任意项目目录执行以下任一命令后，仓库会自动同步到这里：", "Run any of these commands inside a project directory to register it here:") + "</p>" +
              '<div class="empty-cmds"><code class="empty-cmd">idd start &lt;issue#&gt;</code><code class="empty-cmd">idd status</code><code class="empty-cmd">idd repos add .</code></div>' +
            "</div>",
            "empty-norepo"
          );
          return;
        }

        const items = state.cleanupOnly ? collectRetainedWorktrees(snap, false) : collectItems(false);
        const hasFilters = Boolean(state.search.trim() || state.worktreeOnly || state.alertsOnly || state.readyOnly || state.todoOnly || state.cleanupOnly);
        if (items.length === 0 && snap.forge_syncing && !hasFilters && !state.initialLoadSettled) {
          reconcileMainContent(container, renderMainSkeleton(), "loading-sync");
          return;
        }
        if (!snap.forge_syncing || snap.local_only || items.length > 0) {
          state.initialLoadSettled = true;
        }
        if (items.length === 0) {
          if (state.viewMode === "repos" && !state.cleanupOnly && collectRetainedWorktrees(snap, false).length > 0) {
            reconcileMainContent(container, renderReposView(items, snap), "repos");
            return;
          }
          const qText = state.search.trim();
          let emptyTitle = tr("当前筛选条件下没有内容", "No matching items");
          let emptyDesc = tr("可以切换仓库、清空搜索词或重置筛选。", "Try switching repositories, clearing search, or resetting filters.");
          if (qText) {
            emptyTitle = tr("未找到匹配「" + qText + "」的任务", 'No items matching "' + qText + '"');
            emptyDesc = tr("尝试调整关键词、切换仓库或重置全部筛选。", "Try another keyword, switch repositories, or reset filters.");
          } else if (state.alertsOnly) {
            emptyTitle = tr("当前一切正常，无异常或卡住任务", "All clear — no failing CI or stalled worktrees");
            emptyDesc = tr("所有活跃分支运行平稳，可切回「全部活跃」查看整体进度。", 'Everything looks healthy. Switch back to "All Active" for the full view.');
          } else if (state.readyOnly) {
            emptyTitle = tr("暂无待合入的 PR / MR", "No PRs or MRs ready to land");
            emptyDesc = tr("当任务全部完成且 CI 全绿后，卡片会自动归集到这里。", "Items appear here once all TASKs finish and CI turns green.");
          } else if (state.cleanupOnly) {
            emptyTitle = tr("暂无可清理的已合入目录", "No merged worktrees waiting for cleanup");
            emptyDesc = tr("已合入且工作区干净的本地目录会自动汇总在这里。", "Clean post-land worktrees will show up here when ready.");
          } else if (state.todoOnly) {
            emptyTitle = tr("暂无待处理的 Issue", "No queued Issues");
            emptyDesc = tr("当前筛选范围内的 Issue 均已进入工作树或合并流程。", "All Issues in scope already have an active worktree or PR/MR.");
          } else if (state.worktreeOnly) {
            emptyTitle = tr("当前无正在施工的工作树", "No active worktrees in progress");
            emptyDesc = tr("执行 idd start <issue#> 开工后，工作树脉搏会实时出现在这里。", "Run idd start <issue#> to spin up an isolated worktree.");
          }
          reconcileMainContent(
            container,
            '<div class="empty-state">' +
              '<h3 style="margin:0 0 6px;font-size:14.5px;color:var(--text);">' + escapeHtml(emptyTitle) + "</h3>" +
              '<p style="margin:0 0 12px;font-size:12.5px;">' + escapeHtml(emptyDesc) + "</p>" +
              '<button class="btn" type="button" data-kpi-action="clear-filters">' + icon("refresh", 12) + "<span>" + tr("重置筛选", "Reset Filters") + "</span></button>" +
            "</div>",
            "empty-filtered"
          );
          return;
        }

        const showRepoOnCard = state.selectedRepo === "ALL" && repos.length > 1;
        if (state.viewMode === "kanban" && !state.cleanupOnly) {
          const buckets = {
            todo: { id: "todo", title: tr("待处理 Issue", "Open Issues"), dot: "quiet", items: [] },
            developing: { id: "developing", title: tr("开发中", "In Progress"), dot: "active", items: [] },
            review: { id: "review", title: tr("PR / 修 CI", "PR / Fix CI"), dot: "warm", items: [] },
            ready: { id: "ready", title: tr("待合入", "Ready to Land"), dot: "active", items: [] }
          };
          for (const item of items) {
            buckets[cardBucket(item)].items.push(item);
          }
          const kanbanHtml = '<div class="kanban">' + Object.values(buckets).map((col) =>
            '<section class="column">' +
              '<div class="col-hdr"><span class="col-title"><span class="status-dot ' + col.dot + '"></span><span>' + escapeHtml(col.title) + '</span></span><span class="col-count">' + col.items.length + "</span></div>" +
              '<div class="card-stack">' + (col.items.length ? col.items.map((it) => renderCard(it, { showRepo: showRepoOnCard })).join("") : '<div class="col-empty">' + tr("暂无", "Empty") + "</div>") + "</div>" +
            "</section>"
          ).join("") + "</div>";
          reconcileMainContent(container, kanbanHtml, "kanban");
        } else if (state.viewMode === "list" || (state.viewMode === "kanban" && state.cleanupOnly)) {
          reconcileMainContent(container, renderListTable(items), "list");
        } else {
          reconcileMainContent(container, renderReposView(items, snap), "repos");
        }
      }

      function renderInspector() {
        const overlay = document.getElementById("inspector-overlay");
        const panel = document.getElementById("inspector-panel");
        if (!overlay || !panel) return;

        if (!state.inspectedKey || !state.snapshot) {
          overlay.classList.remove("open");
          panel.classList.remove("open");
          overlay.setAttribute("aria-hidden", "true");
          panel.setAttribute("aria-hidden", "true");
          return;
        }

        const item = [...collectItems(true), ...collectRetainedWorktrees(state.snapshot, true)].find((x) => x._key === state.inspectedKey);
        if (!item) {
          state.inspectedKey = null;
          overlay.classList.remove("open");
          panel.classList.remove("open");
          overlay.setAttribute("aria-hidden", "true");
          panel.setAttribute("aria-hidden", "true");
          return;
        }

        const stInfo = parseStage(item.stage);
        const pulse = item.pulse || null;
        const tasks = item.tasks || [];
        const changedFiles = (pulse && pulse.changed_files) || [];
        const { total, done, pct } = getProgressNumbers(item);
        const quickCli = getStageQuickCli(item);
        const handoffPrompt = buildHandoffPrompt(item);

        let tabBody = "";
        if (state.inspectorTab === "files") {
          tabBody = changedFiles.length === 0
            ? '<div class="col-empty">' + tr("当前工作区干净，暂无未提交改动", "Clean working tree; no uncommitted changes") + "</div>"
            : '<div class="file-list">' + changedFiles.map((f) => {
                const code = String(f.code || "M").trim();
                const cls = code === "??" ? "untracked" : (code.includes("D") ? "deleted" : "");
                return '<div class="file-row"><span class="file-code ' + cls + '">' + escapeHtml(code) + "</span><span>" + escapeHtml(f.path) + "</span></div>";
              }).join("") + "</div>";
        } else {
          const taskBadgeMeta = (rawSt) => {
            const k = String(rawSt || "planned").toLowerCase();
            if (k === "done") return { cls: "tone-success", text: tr("已完成", "Done") };
            if (k === "in_progress") return { cls: "tone-info", text: tr("进行中", "In Progress") };
            if (k === "blocked") return { cls: "tone-danger", text: tr("受阻", "Blocked") };
            if (k === "deferred") return { cls: "tone-warning", text: tr("已暂缓", "Deferred") };
            if (k === "cancelled") return { cls: "tone-muted", text: tr("已取消", "Cancelled") };
            return { cls: "tone-muted", text: tr("待执行", "Planned") };
          };
          tabBody = tasks.length === 0
            ? '<div class="col-empty">' + (item.worktree ? tr("已建工作目录，尚未拆解任务步骤", "Worktree ready; TASK/ steps pending") : tr("暂无本地任务步骤", "No local TASK steps yet")) + "</div>"
            : '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);margin-bottom:5px;" class="num"><span>' + tr("总体进度", "Progress") + "</span><span>" + done + " / " + total + " (" + pct + '%)</span></div><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>' +
              tasks.map((t) => {
                const tb = taskBadgeMeta(t.status);
                return '<div class="task-row"><div class="task-row-top"><span>' + escapeHtml(t.title || t.id) + '</span><span class="badge ' + tb.cls + '">' + escapeHtml(tb.text) + "</span></div></div>";
              }).join("");
        }

        const nextInspectorHtml =
          '<div class="inspector-hdr">' +
            '<div style="min-width:0;flex:1;">' +
              '<div class="card-meta" style="flex-wrap:wrap;">' + renderRepoChip(item, { compact: true }) + renderIdHtml(item) + '<span class="badge ' + stInfo.tone + '">' + escapeHtml(stInfo.label) + "</span>" + renderPrimaryLinkBtn(item, "btn-xs", { stopOpen: false }) + "</div>" +
              '<h2 class="inspector-title">' + escapeHtml(item.title || item.issue || tr("未命名任务", "Untitled task")) + "</h2>" +
            "</div>" +
            '<button class="icon-btn" id="inspector-close-btn" type="button" aria-label="' + tr("关闭详情", "Close details") + '">' + icon("x", 15) + "</button>" +
          "</div>" +
          '<div class="inspector-body">' +
            '<div class="meta-grid">' +
              '<div class="meta-row"><span class="meta-key">' + tr("分支", "Branch") + '</span><span class="meta-val">' + escapeHtml(item.branch || "—") + "</span>" + (item.branch ? '<button class="btn btn-xs btn-icon-only" data-copy-val="' + escapeHtml(item.branch) + '" data-copy-msg="' + tr("已复制分支名", "Copied branch name") + '" type="button">' + icon("copy", 11) + "</button>" : "") + "</div>" +
              '<div class="meta-row"><span class="meta-key">' + tr("工作目录", "Worktree") + '</span><span class="meta-val">' + escapeHtml(item.worktree || tr("尚未创建", "Not created")) + "</span>" + (item.worktree ? '<button class="btn btn-xs btn-icon-only" data-copy-val="' + escapeHtml(item.worktree) + '" data-copy-msg="' + tr("已复制工作目录路径", "Copied worktree path") + '" type="button">' + icon("copy", 11) + "</button>" : "") + "</div>" +
            "</div>" +
            '<div class="handoff-box">' +
              '<div class="handoff-box-hdr"><span>' + tr("跨 Agent 接力提示词", "Cross-Agent Handoff Prompt") + '</span><button class="btn btn-xs btn-primary" data-copy-val="' + escapeHtml(handoffPrompt) + '" data-copy-msg="' + tr("已复制 Agent 接力词，可直接粘贴给任意 Agent", "Copied Agent handoff prompt") + '" type="button">' + icon("copy", 11) + "<span>" + tr("复制接力词", "Copy Handoff") + "</span></button></div>" +
              '<pre class="handoff-pre">' + escapeHtml(handoffPrompt) + "</pre>" +
            "</div>" +
            (quickCli ? '<div class="cmd-box"><div class="cmd-box-hdr"><span>' + escapeHtml(tr("终端快捷命令", "Quick CLI Command") + " · " + quickCli.label) + '</span><button class="btn btn-xs" data-copy-val="' + escapeHtml(quickCli.cmd) + '" data-copy-msg="' + escapeHtml(tr("已复制命令: ", "Copied command: ") + quickCli.cmd) + '" type="button">' + icon("copy", 11) + "<span>" + tr("复制", "Copy") + '</span></button></div><div class="cmd-code">$ ' + escapeHtml(quickCli.cmd) + "</div></div>" : "") +
            '<div class="tabs">' +
              '<button class="tab-btn ' + (state.inspectorTab === "tasks" ? "active" : "") + '" data-inspector-tab="tasks" type="button">' + tr("任务步骤", "Steps") + " (" + tasks.length + ")</button>" +
              '<button class="tab-btn ' + (state.inspectorTab === "files" ? "active" : "") + '" data-inspector-tab="files" type="button">' + tr("改动文件", "Files") + " (" + ((pulse && pulse.dirty_count) || 0) + ")</button>" +
            "</div>" +
            '<div class="tab-pane">' + tabBody + "</div>" +
          "</div>";

        const canPatchInsp = typeof window !== "undefined" && typeof panel.querySelector === "function";
        if (!canPatchInsp) {
          panel.innerHTML = nextInspectorHtml;
          overlay.classList.add("open");
          panel.classList.add("open");
          overlay.setAttribute("aria-hidden", "false");
          panel.setAttribute("aria-hidden", "false");
          return;
        }

        const wasOpen = panel.classList.contains("open");
        const prevKey = panel.dataset.inspectedKey || "";
        const prevTab = panel.dataset.tab || "";
        if (wasOpen && prevKey === state.inspectedKey && panel.querySelector(".inspector-body")) {
          const tplI = document.createElement("template");
          tplI.innerHTML = nextInspectorHtml;
          const curHdr = panel.querySelector(".inspector-hdr");
          const nextHdr = tplI.content.querySelector(".inspector-hdr");
          if (curHdr && nextHdr && curHdr.innerHTML !== nextHdr.innerHTML) {
            curHdr.innerHTML = nextHdr.innerHTML;
          }
          const curMeta = panel.querySelector(".meta-grid");
          const nextMeta = tplI.content.querySelector(".meta-grid");
          if (curMeta && nextMeta) patchHtmlPreservingCopied(curMeta, nextMeta);

          const curPre = panel.querySelector(".handoff-pre");
          const nextPre = tplI.content.querySelector(".handoff-pre");
          if (curPre && nextPre && curPre.textContent !== nextPre.textContent) {
            curPre.textContent = nextPre.textContent;
          }
          const curHandoffBtn = panel.querySelector(".handoff-box [data-copy-val]");
          const nextHandoffBtn = tplI.content.querySelector(".handoff-box [data-copy-val]");
          if (curHandoffBtn && nextHandoffBtn) {
            curHandoffBtn.setAttribute("data-copy-val", nextHandoffBtn.getAttribute("data-copy-val") || "");
          }

          const curCmd = panel.querySelector(".cmd-box");
          const nextCmd = tplI.content.querySelector(".cmd-box");
          if (curCmd && nextCmd) patchHtmlPreservingCopied(curCmd, nextCmd);

          const curTabBtns = panel.querySelectorAll(".tabs .tab-btn");
          const nextTabBtns = tplI.content.querySelectorAll(".tabs .tab-btn");
          if (curTabBtns.length === nextTabBtns.length) {
            for (let i = 0; i < curTabBtns.length; i++) {
              curTabBtns[i].className = nextTabBtns[i].className;
              curTabBtns[i].textContent = nextTabBtns[i].textContent;
            }
          }
          const curPane = panel.querySelector(".tab-pane");
          const nextPane = tplI.content.querySelector(".tab-pane");
          if (curPane && nextPane) {
            if (prevTab !== state.inspectorTab) {
              curPane.innerHTML = nextPane.innerHTML;
              if (!prefersReducedMotion()) {
                curPane.classList.remove("is-fading");
                void curPane.offsetWidth;
                curPane.classList.add("is-fading");
              }
            } else {

      function buildFallbackAuthHosts() {
        const snap = state.snapshot;
        if (!snap) return [];
        const map = new Map();
        for (const a of snap.auth_alerts || []) {
          const k = a.host || a.api_base || "";
          if (!k) continue;
          map.set(k, {
            host: a.host || k,
            api_base: a.api_base || k,
            forge: a.forge || "gitlab",
            repos: (a.repos || []).map((name) => {
              const r = (snap.repos || []).find((x) => x.repo_name === name);
              return { name, url: (r && r.repo_url) || "", path: (r && r.repo_path) || "" };
            }),
            configured: false,
            auth_source: "missing",
            masked_token: "",
            username: "",
            token_url: a.token_url || "",
            can_remove: false
          });
        }
        for (const r of snap.repos || []) {
          if (r.forge !== "github" && r.forge !== "gitlab") continue;
          const u = safeUrl(r.repo_url);
          if (!u) continue;
          let hostKey = "";
          let apiBase = "";
          try {
            const parsed = new URL(u);
            hostKey = parsed.host;
            apiBase = parsed.origin;
          } catch (_e) {
            continue;
          }
          if (!map.has(hostKey) && !map.has(apiBase)) {
            map.set(hostKey, {
              host: hostKey,
              api_base: apiBase,
              forge: r.forge,
              repos: [{ name: r.repo_name, url: u, path: r.repo_path || "" }],
              configured: Boolean(r.forge_connected),
              auth_source: r.forge_connected ? "ready" : "missing",
              masked_token: "",
              username: "",
              token_url: r.forge === "gitlab"
                ? (apiBase + "/-/user_settings/personal_access_tokens?name=IDD+Board&scopes=api")
                : (hostKey === "github.com"
                    ? "https://github.com/settings/tokens/new?description=IDD+Board&scopes=repo"
                    : (apiBase + "/settings/tokens/new?description=IDD+Board&scopes=repo")),
              can_remove: false
            });
          } else {
            const existing = map.get(hostKey) || map.get(apiBase);
            if (existing && !existing.repos.some((x) => x.name === r.repo_name)) {
              existing.repos.push({ name: r.repo_name, url: u, path: r.repo_path || "" });
            }
          }
        }
        return Array.from(map.values());
      }

      async function submitHostToken(targetHost, forgeType, rawToken, skipVerify) {
        const cleaned = String(rawToken || "").trim();
        if (!cleaned) {
          state.authErrors[targetHost] = tr("请先粘贴生成的个人访问令牌（Token）", "Please paste your Personal Access Token first");
          state.lastTopAlertsSig = "";
          renderTopAlerts(state.snapshot);
          if (state.setupOpen) renderSetupModal();
          focusAndNudgeTokenInput(state.setupOpen ? "#setup-modal" : "#top-alerts-wrap", targetHost, true);
          return false;
        }
        state.authSavingHost = targetHost;
        delete state.authErrors[targetHost];
        state.lastTopAlertsSig = "";
        renderTopAlerts(state.snapshot);
        if (state.setupOpen) renderSetupModal();
        try {
          const res = await fetch("/api/auth/save", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-IDD-Request": "1"
            },
            body: JSON.stringify({
              host: targetHost,
              forge: forgeType,
              token: cleaned,
              no_verify: Boolean(skipVerify),
              auto_repo_init: Boolean(state.autoRepoInit)
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.error || ("HTTP " + res.status));
          }
          delete state.tokenDrafts[targetHost];
          delete state.editingHosts[targetHost];
          if (data.auth) state.authStatus = data.auth;
          state.showCustomHostForm = false;
          state.customHostUrl = "";
          state.customHostToken = "";
          const who = data.username ? (" (@" + data.username + ")") : "";
          const riRes = Array.isArray(data.repo_init_results) ? data.repo_init_results : [];
          const riAlignedCnt = riRes.filter((x) => x && x.ok && x.aligned).length;
          const riFailCnt = riRes.filter((x) => x && !x.ok).length;
          let toastMsg = tr("令牌已保存并验证成功" + who + "，正在同步远端数据...", "Token verified & saved" + who + "; syncing remote data...");
          if (riAlignedCnt > 0 && riFailCnt === 0) {
            toastMsg = tr("令牌已保存" + who + "，已自动初始化 " + riAlignedCnt + " 个仓库的线性 Squash 策略", "Saved" + who + " & auto-initialized " + riAlignedCnt + " repo(s)");
          } else if (riFailCnt > 0) {
            toastMsg = tr("令牌已保存" + who + "；" + riFailCnt + " 个仓库自动初始化未完成，可点击重试", "Saved" + who + "; " + riFailCnt + " repo(s) pending retry");
          }
          showToast(toastMsg, riFailCnt > 0 ? "err" : "ok");
          await fetchSnapshot(false);
          await fetchAuthStatus();
          state.lastTopAlertsSig = "";
          renderTopAlerts(state.snapshot);
          if (state.setupOpen) renderSetupModal();
          return true;
        } catch (err) {
          state.authErrors[targetHost] = err.message || tr("保存失败", "Failed to save token");
          state.lastTopAlertsSig = "";
          renderTopAlerts(state.snapshot);
          if (state.setupOpen) renderSetupModal();
          focusAndNudgeTokenInput(state.setupOpen ? "#setup-modal" : "#top-alerts-wrap", targetHost, true);
          return false;
        } finally {
          state.authSavingHost = "";
        }
      }

      async function runCleanupQueue(items, scopeKey) {
        if (!items || !items.length || (state.cleanupRun && state.cleanupRun.active)) return;
        state.cleanupRun = {
          active: true,
          stopRequested: false,
          scopeKey: scopeKey || "__all__",
          activeKey: "",
          total: items.length,
          done: 0,
          cleaned: 0,
          skipped: 0
        };
        for (const it of items) {
          delete state.cleanupResults[it._key];
        }
        renderAll(true);

        for (const item of items) {
          if (state.cleanupRun.stopRequested) break;
          state.cleanupRun.activeKey = item._key;
          renderAll(true);
          try {
            const res = await fetch("/api/cleanup", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-IDD-Request": "1"
              },
              body: JSON.stringify({
                repo_path: item.repo_path,
                worktree: item.worktree
              })
            });
            let data = null;
            try { data = await res.json(); } catch (_e) {}
            if (res.ok && data && data.ok) {
              const cardEl = typeof document !== "undefined"
                ? Array.from(document.querySelectorAll("[data-open-key]")).find((el) => el.getAttribute("data-open-key") === item._key)
                : null;
              if (cardEl && !prefersReducedMotion()) {
                cardEl.classList.remove("is-cleaning");
                cardEl.classList.add("is-leaving");
                await new Promise((r) => setTimeout(r, 180));
              }
              state.cleanupRemovedKeys[item._key] = true;
              delete state.cleanupResults[item._key];
              if (state.inspectedKey === item._key) state.inspectedKey = null;
              state.cleanupRun.cleaned += 1;
              if (items.length === 1) {
                showToast(data.message || tr("已移除工作树目录（保留分支）", "Removed worktree directory (branch preserved)"));
              }
            } else {
              const errMsg = (data && (data.error || data.message)) || ("HTTP " + res.status);
              const isErr = !data || (data.status !== "skipped_dirty" && data.status !== "skipped_unmerged");
              state.cleanupResults[item._key] = {
                status: (data && data.status) || "error",
                message: errMsg,
                isError: isErr
              };
              state.cleanupRun.skipped += 1;
              if (items.length === 1) {
                showToast(errMsg, isErr ? "err" : "warn");
              }
            }
          } catch (err) {
            const errMsg = (err && err.message) || tr("请求失败", "Request failed");
            state.cleanupResults[item._key] = { status: "error", message: errMsg, isError: true };
            state.cleanupRun.skipped += 1;
            if (items.length === 1) showToast(errMsg, "err");
          }
          state.cleanupRun.done += 1;
          state.cleanupRun.activeKey = "";
          renderAll(true);
        }

        const wasStopped = state.cleanupRun.stopRequested;
        const cleanedCnt = state.cleanupRun.cleaned;
        const skippedCnt = state.cleanupRun.skipped;
        state.cleanupRun = {
          active: false,
          stopRequested: false,
          scopeKey: "",
          activeKey: "",
          total: 0,
          done: 0,
          cleaned: 0,
          skipped: 0
        };
        renderAll(true);

        if (items.length > 1 || wasStopped) {
          if (wasStopped) {
            showToast(tr("已停止批量清理（已移除 " + cleanedCnt + " 个）", "Cleanup stopped (" + cleanedCnt + " removed)"), "info");
          } else if (skippedCnt > 0) {
            showToast(tr("已清理 " + cleanedCnt + " 个，跳过 " + skippedCnt + " 个（分支均已保留）", "Cleaned " + cleanedCnt + ", skipped " + skippedCnt + " (branches kept)"), "err");

            showToast(tr("已清理 " + cleanedCnt + " 个已合入工作树（分支均已保留）", "Cleaned " + cleanedCnt + " merged worktree(s) (branches kept)"));
          }
        }
        await fetchSnapshot(false);
      }

                  "<strong>" + tr("待初始化仓库线性 Squash 合入策略 (" + pendingPolicyRepos.length + ")", "Repository Linear Squash Policy Pending (" + pendingPolicyRepos.length + ")") + "</strong>" +
                  '<span style="font-size:11.5px;color:var(--text-dim);">' + tr("暂跳过或失败时仍可在左侧仓库栏与设置向导点击执行", "You can still trigger initialization anytime from the sidebar or Setup") + "</span>" +

      function stripVolatilePulse(pulse) {
        if (!pulse || typeof pulse !== "object") return pulse;
        const copy = Object.assign({}, pulse);
        delete copy.idle_seconds;
        delete copy.last_active_ts;
        return copy;
      }

      function stripVolatileItem(item) {
        if (!item || typeof item !== "object") return item;
        if (!item.pulse) return item;
        const copy = Object.assign({}, item);
        copy.pulse = stripVolatilePulse(item.pulse);
        return copy;
      }

      function stripVolatileRepo(repo) {
        if (!repo || typeof repo !== "object") return repo;
        const copy = Object.assign({}, repo);
        delete copy.generated_at;
        delete copy.last_seen_at;
        delete copy.forge_fetched_at;
        if (Array.isArray(copy.issues)) copy.issues = copy.issues.map(stripVolatileItem);
        if (Array.isArray(copy.local_only_items)) copy.local_only_items = copy.local_only_items.map(stripVolatileItem);
        if (Array.isArray(copy.tasks)) copy.tasks = copy.tasks.map(stripVolatileItem);
        return copy;
      }

      function computeRenderSignature(snap) {
        if (!snap) return "";
        return JSON.stringify({
          g: snap.global,
          rc: snap.repos_config_path,
          s: snap.summary,
          r: Array.isArray(snap.repos) ? snap.repos.map(stripVolatileRepo) : snap.repos,
          i: Array.isArray(snap.issues) ? snap.issues.map(stripVolatileItem) : snap.issues,
          l: Array.isArray(snap.local_only_items) ? snap.local_only_items.map(stripVolatileItem) : snap.local_only_items,
          o: snap.orphan_changes,
          aa: snap.auth_alerts,
          fs: snap.forge_syncing,
          lo: snap.local_only,
          fconn: snap.forge_connections,
          ac: state.authStatus ? state.authStatus.unconfigured_count : -1,
          fc: state.fromCache,
          hl: state.hasLiveSnapshot,
          ils: Boolean(state.initialLoadSettled),
          w: snap.warnings,
          sr: state.selectedRepo,
          vm: state.viewMode,
          sc: state.sidebarCollapsed,
          lg: state.lang,
          sq: state.search,
          wo: state.worktreeOnly,
          ao: state.alertsOnly,
          ro: state.readyOnly,
          to: state.todoOnly,
          co: state.cleanupOnly,
          cdo: state.cleanupDrawerOpen,
          ik: state.inspectedKey,
          it: state.inspectorTab,
          ri: state.repoInitRunning,
          rie: state.repoInitErrors,
          ribd: state.repoInitBannerDismissed,
          cfg: snap.config,
          ams: state.autoMergeSaving,
          cr: state.cleanupRun ? (state.cleanupRun.active ? state.cleanupRun.done + ":" + state.cleanupRun.activeKey + ":" + state.cleanupRun.stopRequested : "0") : "0",
          crk: state.cleanupRemovedKeys,
          cres: state.cleanupResults
        });
      }

      function computeNextPollDelayMs(snap) {
        if (snap && snap.forge_syncing) return 1200;
        const s = snap && snap.summary;
        if (!s) return 4000;
        if (Number(s.coding_now_count || 0) > 0 || Number(s.dirty_worktrees || 0) > 0) {
          return 4000;
        }
        if (Number(s.active_worktrees || 0) > 0) {
          return 8000;
        }
        return 15000;
      }

      function clearPollTimers() {
        if (state.timerId) {
          clearTimeout(state.timerId);
          state.timerId = null;
        }
        if (state.quickSyncTimerId) {
          clearTimeout(state.quickSyncTimerId);
          state.quickSyncTimerId = null;
        }
      }

      function scheduleNextPoll(delayOverrideMs) {
        clearPollTimers();
        if (state.paused || document.hidden) return;
        const delay = typeof delayOverrideMs === "number" ? delayOverrideMs : computeNextPollDelayMs(state.snapshot);
        state.timerId = setTimeout(() => {
          state.timerId = null;
          if (!state.paused && !document.hidden) {
            fetchSnapshot(false);
          }
        }, delay);
      }

      function renderAll(force) {
        const snap = state.snapshot;
        if (!snap) {
          syncHeaderControls();
          updateConnectionBadge(!state.initError, state.initError);
          renderLoadingState();
          return true;
        }

        state.lastClockStr = formatClock(snap.generated_at);
        const updatedTag = document.getElementById("updated-tag");
        if (updatedTag && updatedTag.textContent !== state.lastClockStr) {
          updatedTag.textContent = state.lastClockStr;
        }

        const sig = computeRenderSignature(snap);
        if (!force && sig === state.lastSig) {
          return false;
        }
        state.lastSig = sig;

        syncHeaderControls();
        renderWorkspaceHeader(snap);
        renderTopAlerts(snap);
        renderKpis(snap);
        renderMain();
        renderSidebarReposAndWorktrees(snap);
        renderInspector();

        const authAlerts = snap.auth_alerts || [];
        const warns = (snap.warnings || []).filter((w) => !authAlerts.length || !String(w).includes("需要鉴权"));
        const warnsHtml = warns.length
          ? '<div class="warnings-box">' + icon("alertTriangle", 14) + "<div><strong>" + tr("提示：", "Notice: ") + "</strong>" + warns.map((w) => escapeHtml(w)).join(" ｜ ") + "</div></div>"
          : "";
        const warningsWrap = document.getElementById("warnings-wrap");
        if (warningsWrap && warningsWrap._lastHtml !== warnsHtml) {
          warningsWrap._lastHtml = warnsHtml;
          warningsWrap.innerHTML = warnsHtml;
        }

        const retainedCount = (snap.repos || []).reduce((acc, r) => acc + (r.retained_idle_worktrees || []).length, 0);
        const retainedText = retainedCount > 0
          ? tr("已合入保留目录：" + retainedCount + " 个", retainedCount + " retained merged worktree(s)")
          : tr("保留目录均已清理", "No retained merged worktrees");
        const footerEl = document.getElementById("footer");
        const footerHtml =
          "<span>" + tr("仓库索引：", "Repo index: ") + "<code>" + escapeHtml(snap.repos_config_path || "~/.config/idd/repos.json") + "</code></span>" +
          "<span>" + escapeHtml(retainedText) + " · " + tr("快捷键 <code>[</code> 收起侧栏 · <code>/</code> 搜索 · <code>r</code> 同步远端", "Shortcuts: <code>[</code> sidebar · <code>/</code> search · <code>r</code> sync") + "</span>";
        if (footerEl && footerEl._lastHtml !== footerHtml) {
          footerEl._lastHtml = footerHtml;
          footerEl.innerHTML = footerHtml;
        }
        return true;
      }

      async function fetchSnapshot(forceRefresh) {
        if (state.fetching && !forceRefresh) return;
        clearPollTimers();
        state.fetching = true;
        if (forceRefresh) state.manualRefreshing = true;
        if (!state.snapshot && !state.slowInitTimerId) {
          state.slowInitTimerId = setTimeout(() => {
            state.slowInitTimerId = null;
            if (!state.snapshot && !state.initError) {
              state.slowInit = true;
              renderAll(true);
            }
          }, 3500);
        }
        syncHeaderControls();
        try {
          const url = forceRefresh ? "/api/snapshot?refresh=1" : "/api/snapshot";
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const nextSnap = await res.json();
          clearTimeout(state.slowInitTimerId);
          state.slowInitTimerId = null;
          state.snapshot = nextSnap;
          const liveRetainedKeys = new Set();
          for (const r of (nextSnap.repos || [])) {
            for (const w of (r.retained_idle_worktrees || [])) {
              liveRetainedKeys.add(r.repo_path + "#retained#" + (w.worktree || w.name || w.branch || ""));
            }
          }
          for (const k of Object.keys(state.cleanupRemovedKeys)) {
            if (!liveRetainedKeys.has(k)) delete state.cleanupRemovedKeys[k];
          }
          state.hasLiveSnapshot = true;
          state.fromCache = false;
          if (!nextSnap.forge_syncing || nextSnap.local_only) {
            state.initialLoadSettled = true;
          }
          state.initError = "";
          state.slowInit = false;
          if (!state.didAutoInspect) {
            state.didAutoInspect = true;
            const qInspect = urlParams.get("inspect");
            if (qInspect) {
              const found = collectItems(true).find((it) => String(it.issue_number) === qInspect || it._key === qInspect);
              if (found) {
                state.inspectedKey = found._key;
              }
            }
          }
          state.lastClockStr = formatClock(state.snapshot.generated_at);
          updateConnectionBadge(true);
          const didRender = renderAll(false);
          if (didRender) {
            setTimeout(() => saveCachedSnapshot(nextSnap), 0);
          }
          if (!state.didCheckOnboarding) {
            const qOnb = urlParams.get("onboarding");
            const forceOnb = qOnb === "1" || qOnb === "guide";
            if (forceOnb || !state.snapshot.forge_syncing) {
              state.didCheckOnboarding = true;
              const hasAlerts = ((state.snapshot && state.snapshot.auth_alerts) || []).length > 0;
              if (forceOnb) {
                openSetupModal(qOnb === "guide" ? "guide" : "auth");
              } else if (!urlParams.has("inspect") && qOnb !== "0") {
                if (hasAlerts && !sessionStorage.getItem("idd_setup_dismissed")) {
                  openSetupModal("auth");
                } else if (!localStorage.getItem("idd_onboarding_done")) {
                  openSetupModal(hasAlerts ? "auth" : "guide");
                }
              }
            }
          }
          if (forceRefresh) {
            if (state.snapshot && state.snapshot.local_only) {
              state.pendingManualSyncToast = false;
              showToast(tr("已刷新本地工作树", "Local worktrees refreshed"));
            } else if (state.snapshot && state.snapshot.forge_syncing) {
              state.pendingManualSyncToast = true;
              showToast(tr("正在同步远端状态…", "Syncing remote status…"), "info");
            } else {
              state.pendingManualSyncToast = false;
              showToast(tr("远端同步已完成", "Remote sync complete"));
            }
          } else if (state.pendingManualSyncToast && state.snapshot && !state.snapshot.forge_syncing) {
            state.pendingManualSyncToast = false;
            showToast(tr("远端同步已完成", "Remote sync complete"));
          }
        } catch (err) {
          if (!state.snapshot) {
            clearTimeout(state.slowInitTimerId);
            state.slowInitTimerId = null;
            state.initError = err && err.message ? err.message : tr("连接异常", "Network error");
            updateConnectionBadge(false, tr("初始化失败", "Init failed"));
            renderAll(true);
          } else {
            updateConnectionBadge(false, tr("连接异常: ", "Sync error: ") + err.message);
          }
        } finally {
          state.fetching = false;
          if (forceRefresh) state.manualRefreshing = false;
          syncHeaderControls();
          scheduleNextPoll();
        }
      }

      function handleActionClick(e) {
        const copyBtn = e.target.closest("[data-copy-val]");
        if (copyBtn) {
          e.stopPropagation();
          copyText(copyBtn.getAttribute("data-copy-val") || "", copyBtn, copyBtn.getAttribute("data-copy-msg") || "");
          return true;
        }
        if (e.target.closest("[data-stop-open]")) {
          return true;
        }
        const kpiBtn = e.target.closest("[data-kpi-action]");
        if (kpiBtn) {
          const act = kpiBtn.getAttribute("data-kpi-action");
          if (act === "filter-all") {
            state.worktreeOnly = false;
            state.alertsOnly = false;
            state.readyOnly = false;
            state.todoOnly = false;
            state.cleanupOnly = false;
          } else if (act === "toggle-wt") {
            state.worktreeOnly = !state.worktreeOnly;
            if (state.worktreeOnly) {
              state.alertsOnly = false;
              state.readyOnly = false;
              state.todoOnly = false;
              state.cleanupOnly = false;
            }
          } else if (act === "toggle-alerts") {
            state.alertsOnly = !state.alertsOnly;
            if (state.alertsOnly) {
              state.worktreeOnly = false;
              state.readyOnly = false;
              state.todoOnly = false;
              state.cleanupOnly = false;
            }
          } else if (act === "toggle-ready") {
            state.readyOnly = !state.readyOnly;
            if (state.readyOnly) {
              state.worktreeOnly = false;
              state.alertsOnly = false;
              state.todoOnly = false;
              state.cleanupOnly = false;
            }
          } else if (act === "toggle-todo") {
            state.todoOnly = !state.todoOnly;
            if (state.todoOnly) {
              state.worktreeOnly = false;
              state.alertsOnly = false;
              state.readyOnly = false;
              state.cleanupOnly = false;
            }
          } else if (act === "toggle-cleanup") {
            state.cleanupOnly = !state.cleanupOnly;
            if (state.cleanupOnly) {
              state.worktreeOnly = false;
              state.alertsOnly = false;
              state.readyOnly = false;
              state.todoOnly = false;
            }
          } else if (act === "clear-filters") {
            state.selectedRepo = "ALL";
            state.worktreeOnly = false;
            state.alertsOnly = false;
            state.readyOnly = false;
            state.todoOnly = false;
            state.cleanupOnly = false;
            state.search = "";
            document.getElementById("search-input").value = "";
            document.getElementById("search-wrap").classList.remove("has-value");
          }
          renderAll(true);
          const nextChip = document.querySelector('#kpis [data-kpi-action="' + CSS.escape(act) + '"]');
          if (nextChip && !prefersReducedMotion()) {
            nextChip.classList.remove("just-clicked");
            void nextChip.offsetWidth;
            nextChip.classList.add("just-clicked");
            setTimeout(() => nextChip.classList.remove("just-clicked"), 420);
          }
          return true;
        }
        return false;
      }

      document.getElementById("kpis").addEventListener("click", handleActionClick);
      document.getElementById("warnings-wrap").addEventListener("click", handleActionClick);

      document.getElementById("setup-btn").addEventListener("click", () => {
        const hasAlerts = ((state.snapshot && state.snapshot.auth_alerts) || []).length > 0;
        openSetupModal(hasAlerts ? "auth" : (state.setupTab || "auth"));
      });

      document.getElementById("top-alerts-wrap").addEventListener("input", (e) => {
        const inp = e.target.closest("[data-token-draft]");
        if (inp) {
          state.tokenDrafts[inp.getAttribute("data-token-draft")] = inp.value || "";
        }
      });

      document.getElementById("top-alerts-wrap").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const inp = e.target.closest("[data-token-draft]");
          if (inp) {
            const target = inp.getAttribute("data-token-draft");
            const btn = document.querySelector('#top-alerts-wrap [data-save-host="' + CSS.escape(target) + '"]');
            if (btn) btn.click();
          }
        }
      });

      document.getElementById("top-alerts-wrap").addEventListener("click", (e) => {
        const dismissBanner = e.target.closest("[data-dismiss-repo-init-banner]");
        if (dismissBanner) {
          const box = dismissBanner.closest(".auth-alert-box");
          if (box && !prefersReducedMotion() && typeof box.animate === "function") {
            const h = box.offsetHeight;
            const anim = box.animate(
              [
                { opacity: 1, height: h + "px", paddingTop: "13px", paddingBottom: "13px", marginBottom: "0px" },
                { opacity: 0, height: "0px", paddingTop: "0px", paddingBottom: "0px", marginBottom: "-10px" }
              ],
              { duration: 170, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
            );
            box.style.overflow = "hidden";
            anim.onfinish = () => {
              state.repoInitBannerDismissed = true;
              state.lastTopAlertsSig = "";
              renderTopAlerts(state.snapshot);
            };
          } else {
            state.repoInitBannerDismissed = true;
            state.lastTopAlertsSig = "";
            renderTopAlerts(state.snapshot);
          }
          return;
        }
        const applyBtn = e.target.closest("[data-apply-repo-init]");
        if (applyBtn) {
          applyRepoInit(applyBtn.getAttribute("data-apply-repo-init") || "");
          return;
        }
        const openBtn = e.target.closest("[data-open-setup]");
        if (openBtn) {
          openSetupModal(openBtn.getAttribute("data-open-setup") || "auth");
          return;
        }
        const saveBtn = e.target.closest("[data-save-host]");
        if (saveBtn) {
          const host = saveBtn.getAttribute("data-save-host") || "";
          const fg = saveBtn.getAttribute("data-save-forge") || "gitlab";
          submitHostToken(host, fg, state.tokenDrafts[host] || "", false);
          return;
        }
        handleActionClick(e);
      });

      document.getElementById("setup-modal").addEventListener("change", (e) => {
        if (e.target && e.target.matches("[data-auto-repo-init-toggle]")) {
          state.autoRepoInit = Boolean(e.target.checked);
          return;
        }
        if (e.target && e.target.matches("[data-am-global-toggle]")) {
          const nextChecked = Boolean(e.target.checked);
          e.target.checked = !nextChecked;
          openAutoMergeConfirm(nextChecked, "PR");
        }
      });

      document.getElementById("setup-modal").addEventListener("input", (e) => {
        const inp = e.target.closest("[data-token-draft]");
        if (inp) {
          state.tokenDrafts[inp.getAttribute("data-token-draft")] = inp.value || "";
          return;
        }
        if (e.target.id === "custom-host-url") state.customHostUrl = e.target.value || "";
        if (e.target.id === "custom-host-token") state.customHostToken = e.target.value || "";
      });

      document.getElementById("setup-modal").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const inp = e.target.closest("[data-token-draft]");
          if (inp) {
            const target = inp.getAttribute("data-token-draft");
            const btn = document.querySelector('#setup-modal [data-save-host="' + CSS.escape(target) + '"]');
            if (btn) btn.click();
          } else if (e.target.id === "custom-host-token" || e.target.id === "custom-host-url") {
            const cbtn = document.getElementById("custom-host-save-btn");
            if (cbtn) cbtn.click();
          }
        }
      });

      document.getElementById("setup-modal").addEventListener("click", async (e) => {
        if (e.target.closest("[data-setup-close]")) {
          closeSetupModal(true);
          return;
        }
        const applyPolicyBtn = e.target.closest("[data-apply-repo-init]");
        if (applyPolicyBtn) {
          await applyRepoInit(applyPolicyBtn.getAttribute("data-apply-repo-init") || "");
          return;
        }
        const tabBtn = e.target.closest("[data-setup-tab]");
        if (tabBtn) {
          const modalEl = document.getElementById("setup-modal");
          const prevH = modalEl ? modalEl.offsetHeight : 0;
          state.setupTab = tabBtn.getAttribute("data-setup-tab") || "auth";
          renderSetupModal();
          if (modalEl && !prefersReducedMotion() && typeof modalEl.animate === "function") {
            const nextH = modalEl.offsetHeight;
            if (prevH > 0 && nextH > 0 && Math.abs(nextH - prevH) > 4) {
              modalEl.animate(
                [{ height: prevH + "px" }, { height: nextH + "px" }],
                { duration: 200, easing: "cubic-bezier(0.32, 0.72, 0, 1)" }
              );
            }
            const bodyEl = modalEl.querySelector(".setup-body");
            if (bodyEl) bodyEl.classList.add("is-swapping");
          }
          return;
        }
        if (e.target.closest("#finish-onboarding-btn")) {
          localStorage.setItem("idd_onboarding_done", "1");
          closeSetupModal(true);
          return;
        }
        const saveBtn = e.target.closest("[data-save-host]");
        if (saveBtn) {
          const host = saveBtn.getAttribute("data-save-host") || "";
          const fg = saveBtn.getAttribute("data-save-forge") || "gitlab";
          await submitHostToken(host, fg, state.tokenDrafts[host] || "", false);
          return;
        }
        const editBtn = e.target.closest("[data-toggle-edit-host]");
        if (editBtn) {
          const h = editBtn.getAttribute("data-toggle-edit-host") || "";
          state.editingHosts[h] = !state.editingHosts[h];
          renderSetupModal();
          if (state.editingHosts[h]) {
            requestAnimationFrame(() => {
              const inp = document.querySelector('#setup-modal [data-token-draft="' + CSS.escape(h) + '"]');
              if (inp) {
                inp.focus({ preventScroll: true });
                inp.scrollIntoView({ block: "nearest", behavior: prefersReducedMotion() ? "auto" : "smooth" });
              }
            });
          }
          return;
        }
        const rmBtn = e.target.closest("[data-remove-host]");
        if (rmBtn) {
          await removeHostToken(rmBtn.getAttribute("data-remove-host") || "");
          return;
        }
        const customToggle = e.target.closest("[data-toggle-custom-host]");
        if (customToggle) {
          state.showCustomHostForm = customToggle.getAttribute("data-toggle-custom-host") === "1";
          renderSetupModal();
          if (state.showCustomHostForm) {
            requestAnimationFrame(() => {
              const urlInp = document.getElementById("custom-host-url");
              if (urlInp) {
                urlInp.focus({ preventScroll: true });
                urlInp.scrollIntoView({ block: "nearest", behavior: prefersReducedMotion() ? "auto" : "smooth" });
              }
            });
          }
          return;
        }
        const cfBtn = e.target.closest("[data-custom-forge]");
        if (cfBtn) {
          state.customHostForge = cfBtn.getAttribute("data-custom-forge") || "gitlab";
          renderSetupModal();
          return;
        }
        if (e.target.closest("#custom-host-save-btn")) {
          const rawUrl = (state.customHostUrl || "").trim();
          const rawTok = (state.customHostToken || "").trim();
          if (!rawUrl || !rawTok) {
            state.authErrors.__custom__ = tr("请填写主机地址并粘贴访问令牌", "Please enter both host URL and token");
            renderSetupModal();
            focusAndNudgeTokenInput("#setup-modal", "__custom__", true);
            return;
          }
          delete state.authErrors.__custom__;
          state.tokenDrafts[rawUrl] = rawTok;
          const ok = await submitHostToken(rawUrl, state.customHostForge, rawTok, false);
          if (!ok && state.authErrors[rawUrl]) {
            state.authErrors.__custom__ = state.authErrors[rawUrl];
            renderSetupModal();
            focusAndNudgeTokenInput("#setup-modal", "__custom__", true);
          }
        }
      });

      document.getElementById("setup-modal-overlay").addEventListener("click", (e) => {
        if (e.target.id === "setup-modal-overlay") {
          closeSetupModal(true);
        }
      });

      document.getElementById("am-confirm-overlay").addEventListener("click", (e) => {
        if (e.target.id === "am-confirm-overlay") {
          closeAutoMergeConfirm();
        }
      });

      document.getElementById("am-confirm-modal").addEventListener("click", async (e) => {
        if (e.target.closest("[data-am-confirm-cancel]")) {
          closeAutoMergeConfirm();
          return;
        }
        const submitBtn = e.target.closest("[data-am-confirm-submit]");
        if (submitBtn && state.amConfirm) {
          const pending = state.amConfirm;
          submitBtn.disabled = true;
          submitBtn.classList.add("spin");
          submitBtn.innerHTML = icon("refresh", 13) + "<span>" + tr("保存中...", "Saving...") + "</span>";
          await setAutoMergeSetting(pending.nextValue);
          closeAutoMergeConfirm();
        }
      });

      document.getElementById("cleanup-confirm-overlay").addEventListener("click", (e) => {
        if (e.target.id === "cleanup-confirm-overlay") {
          closeCleanupConfirm();
        }
      });

      document.getElementById("cleanup-confirm-modal").addEventListener("click", (e) => {
        if (e.target.closest("[data-cleanup-confirm-cancel]")) {
          closeCleanupConfirm();
          return;
        }
        const submitBtn = e.target.closest("[data-cleanup-confirm-submit]");
        if (submitBtn && state.cleanupConfirm) {
          const pending = state.cleanupConfirm;
          closeCleanupConfirm();
          runCleanupQueue(pending.items, pending.scopeKey);
        }
      });

      document.getElementById("ws-repo-link-wrap").addEventListener("click", (e) => {
        const applyBtn = e.target.closest("[data-apply-repo-init]");
        if (applyBtn) {
          applyRepoInit(applyBtn.getAttribute("data-apply-repo-init") || "");
          return;
        }
        const qGlobal = e.target.closest("[data-am-quick-global]");
        if (qGlobal) {
          const nextOn = qGlobal.getAttribute("data-am-next") === "1";
          const tag = qGlobal.getAttribute("data-am-tag") || "PR";
          openAutoMergeConfirm(nextOn, tag);
        }
      });

      document.getElementById("repo-pills").addEventListener("click", (e) => {
        const applyBtn = e.target.closest("[data-apply-repo-init]");
        if (applyBtn) {
          e.stopPropagation();
          applyRepoInit(applyBtn.getAttribute("data-apply-repo-init") || "");
          return;
        }
        if (e.target.closest("[data-stop-repo]")) return;
        const btn = e.target.closest("[data-repo]");
        if (!btn) return;
        state.selectedRepo = btn.getAttribute("data-repo") || "ALL";
        renderAll(true);
      });

      document.getElementById("repo-pills").addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const btn = e.target.closest("[data-repo]");
        if (!btn || e.target !== btn) return;
        e.preventDefault();
        btn.click();
      });

      document.getElementById("main-content").addEventListener("click", (e) => {
        if (handleActionClick(e)) return;
        const stopCleanupBtn = e.target.closest("[data-cleanup-stop]");
        if (stopCleanupBtn) {
          e.stopPropagation();
          if (state.cleanupRun && state.cleanupRun.active) {
            state.cleanupRun.stopRequested = true;
            renderAll(true);
          }
          return;
        }
        const batchCleanupBtn = e.target.closest("[data-cleanup-open-batch]");
        if (batchCleanupBtn) {
          e.stopPropagation();
          openCleanupConfirm("batch", batchCleanupBtn.getAttribute("data-cleanup-open-batch") || "__all__");
          return;
        }
        const oneCleanupBtn = e.target.closest("[data-cleanup-one]");
        if (oneCleanupBtn) {
          e.stopPropagation();
          openCleanupConfirm("single", oneCleanupBtn.getAttribute("data-cleanup-one") || "");
          return;
        }
        const toggleDrawer = e.target.closest("[data-toggle-cleanup-drawer]");
        if (toggleDrawer) {
          const drawerEl = toggleDrawer.closest(".cleanup-drawer");
          const bodyEl = drawerEl ? drawerEl.querySelector(".cleanup-body") : null;
          if (state.cleanupDrawerOpen && bodyEl && !prefersReducedMotion() && typeof bodyEl.animate === "function") {
            drawerEl.classList.remove("is-open");
            toggleDrawer.setAttribute("aria-expanded", "false");
            const h = bodyEl.offsetHeight;
            const anim = bodyEl.animate(
              [{ height: h + "px", opacity: 1, paddingTop: "12px", paddingBottom: "16px" }, { height: "0px", opacity: 0, paddingTop: "0px", paddingBottom: "0px" }],
              { duration: 190, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
            );
            anim.onfinish = () => {
              state.cleanupDrawerOpen = false;
              renderAll(true);
            };
          } else {
            state.cleanupDrawerOpen = !state.cleanupDrawerOpen;
            renderAll(true);
            if (state.cleanupDrawerOpen && !prefersReducedMotion()) {
              const nextBody = document.querySelector(".cleanup-drawer .cleanup-body");
              if (nextBody && typeof nextBody.animate === "function") {
                const h = nextBody.offsetHeight;
                nextBody.animate(
                  [{ height: "0px", opacity: 0, paddingTop: "0px", paddingBottom: "0px" }, { height: h + "px", opacity: 1, paddingTop: "12px", paddingBottom: "16px" }],
                  { duration: 210, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
                );
              }
            }
          }
          return;
        }
        const applyBtn = e.target.closest("[data-apply-repo-init]");
        if (applyBtn) {
          applyRepoInit(applyBtn.getAttribute("data-apply-repo-init") || "");
          return;
        }
        if (e.target.closest("[data-retry-init]")) {
          state.initError = "";
          state.slowInit = false;
          renderAll(true);
          fetchSnapshot(true);
          return;
        }
        const openEl = e.target.closest("[data-open-key]");
        if (openEl) {
          state.inspectedKey = openEl.getAttribute("data-open-key");
          renderAll(true);
        }
      });

      document.getElementById("main-content").addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const openEl = e.target.closest("[data-open-key]");
        if (!openEl || e.target !== openEl) return;
        e.preventDefault();
        openEl.click();
      });

      document.getElementById("inspector-panel").addEventListener("click", (e) => {
        if (handleActionClick(e)) return;
        if (e.target.closest("#inspector-close-btn")) {
          state.inspectedKey = null;
          renderAll(true);
          return;
        }
        const tabBtn = e.target.closest("[data-inspector-tab]");
        if (tabBtn) {
          state.inspectorTab = tabBtn.getAttribute("data-inspector-tab") || "tasks";
          renderAll(true);
        }
      });

      document.getElementById("inspector-overlay").addEventListener("click", () => {
        state.inspectedKey = null;
        renderAll(true);
      });

      document.getElementById("sidebar-toggle").addEventListener("click", () => {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        localStorage.setItem("idd_sidebar_collapsed", state.sidebarCollapsed ? "1" : "0");
        applySidebarState();
        requestAnimationFrame(() => syncAllGliders());
        setTimeout(() => syncAllGliders(), 230);
      });

      document.getElementById("pause-btn").addEventListener("click", () => {
        state.paused = !state.paused;
        if (state.paused) {
          clearPollTimers();
        }
        syncHeaderControls();
        updateConnectionBadge(true);
        if (!state.paused && !document.hidden) fetchSnapshot(false);
      });

      document.getElementById("forge-status-group").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-forge-status]");
        if (!btn) return;
        e.stopPropagation();
        const fg = btn.getAttribute("data-forge-status") || "";
        if (state.statusPopoverOpen && state.statusPopoverForge === fg) {
          state.statusPopoverOpen = false;
          state.statusPopoverForge = "";
        } else {
          state.statusPopoverOpen = true;
          state.statusPopoverForge = fg;
        }
        renderForgeStatus(true);
      });

      document.getElementById("forge-status-popover").addEventListener("click", (e) => {
        e.stopPropagation();
        if (e.target.closest("[data-popover-close]")) {
          state.statusPopoverOpen = false;
          state.statusPopoverForge = "";
          renderForgeStatus(true);
          return;
        }
        if (e.target.closest("[data-popover-sync]")) {
          fetchSnapshot(true);
          fetchAuthStatus();
          renderForgeStatus(true);
          return;
        }
        const setupTarget = e.target.closest("[data-popover-open-setup]");
        if (setupTarget) {
          const fg = setupTarget.getAttribute("data-popover-open-setup") || "";
          state.statusPopoverOpen = false;
          state.statusPopoverForge = "";
          if (fg === "github" || fg === "gitlab") {
            const authHosts = (state.authStatus && Array.isArray(state.authStatus.hosts)) ? state.authStatus.hosts : [];
            if (!authHosts.some((h) => h.forge === fg)) {
              state.showCustomHostForm = true;
              state.customHostForge = fg;
            }
          }
          renderForgeStatus(true);
          openSetupModal("auth");
        }
      });

      document.addEventListener("click", (e) => {
        if (state.statusPopoverOpen && !e.target.closest("#status-cluster")) {
          state.statusPopoverOpen = false;
          state.statusPopoverForge = "";
          renderForgeStatus(true);
        }
      });

      document.getElementById("sync-btn").addEventListener("click", () => {
        fetchSnapshot(true);
      });

      document.getElementById("theme-btn").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") || "dark";
        const next = cur === "dark" ? "light" : "dark";
        localStorage.setItem("idd_board_theme", next);
        applyTheme(next, true);
      });

      document.getElementById("lang-btn").addEventListener("click", () => {
        state.lang = isEn() ? "zh" : "en";
        localStorage.setItem("idd_board_lang", state.lang);
        state.lastTopAlertsSig = "";
        state.lastForgeStatusSig = "";
        applyLang();
        applyTheme(document.documentElement.getAttribute("data-theme") || "dark");
        syncHeaderControls();
        updateConnectionBadge(true);
        renderForgeStatus(true);
        renderAll(true);
        if (state.setupOpen) renderSetupModal();
      });

      const searchInput = document.getElementById("search-input");
      const searchWrap = document.getElementById("search-wrap");
      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value || "";
        searchWrap.classList.toggle("has-value", state.search.length > 0);
        renderAll(true);
      });

      document.getElementById("search-clear").addEventListener("click", (e) => {
        e.stopPropagation();
        state.search = "";
        searchInput.value = "";
        searchWrap.classList.remove("has-value");
        searchInput.focus();
        renderAll(true);
      });

      function setViewMode(mode) {
        state.viewMode = mode;
        localStorage.setItem("idd_board_view", mode);
        syncHeaderControls();
        renderAll(true);
      }

      document.getElementById("view-repos").addEventListener("click", () => setViewMode("repos"));
      document.getElementById("view-kanban").addEventListener("click", () => setViewMode("kanban"));
      document.getElementById("view-list").addEventListener("click", () => setViewMode("list"));

      document.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        const inInput = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
        if (e.key === "Escape") {
          if (state.cleanupConfirm) {
            closeCleanupConfirm();
          } else if (state.amConfirm) {
            closeAutoMergeConfirm();
          } else if (state.setupOpen) {
            closeSetupModal(true);
          } else if (state.statusPopoverOpen) {
            state.statusPopoverOpen = false;
            state.statusPopoverForge = "";
            renderForgeStatus(true);
          } else if (state.inspectedKey) {
            state.inspectedKey = null;
            renderAll(true);
          } else if (document.activeElement === searchInput) {
            searchInput.blur();
          }
          return;
        }
        if (inInput) return;
        if (e.key === "[" && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          state.sidebarCollapsed = !state.sidebarCollapsed;
          localStorage.setItem("idd_sidebar_collapsed", state.sidebarCollapsed ? "1" : "0");
          applySidebarState();
          requestAnimationFrame(() => syncAllGliders());
          setTimeout(() => syncAllGliders(), 230);
        } else if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          fetchSnapshot(true);
        }
      });

      const savedTheme = localStorage.getItem("idd_board_theme") || "dark";
      applyLang();
      applyTheme(savedTheme);
      applySidebarState();
      const cachedSnap = loadCachedSnapshot();
      if (cachedSnap) {
        state.snapshot = cachedSnap;
        state.fromCache = true;
        state.initialLoadSettled = true;
        state.lastClockStr = formatClock(cachedSnap.generated_at);
      }
      document.addEventListener("visibilitychange", () => {
        const hidden = Boolean(document.hidden);
        document.documentElement.classList.toggle("is-tab-hidden", hidden);
        if (hidden) {
          clearPollTimers();
        } else if (!state.paused) {
          fetchSnapshot(false);
        }
      });

      document.documentElement.classList.toggle("is-tab-hidden", Boolean(document.hidden));
      syncHeaderControls();
      updateConnectionBadge(true);
      renderAll(true);
      fetchAuthStatus();
      if (!document.hidden) {
        fetchSnapshot(false);
      }
    })();
  </script>
</body>
</html>
